<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Axiom Shield | AI Safety Infrastructure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #111827;
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-img {
            width: 80px;
            /* Compressed logo size */
            height: auto;
        }

        .company-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .title {
            font-size: 14px;
            color: #60a5fa;
            margin-bottom: 20px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .contact-info a {
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .contact-info a:hover {
            color: #60a5fa;
        }

        .cta {
            margin-top: 20px;
        }

        .cta a {
            display: inline-block;
            padding: 10px 20px;
            background: #2563eb;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .cta a:hover {
            background: #1d4ed8;
        }

        .qr-section {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-code {
            background: #ffffff;
            padding: 8px;
            border-radius: 12px;
            width: 120px;
            height: 120px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .qr-label {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 500;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="card">
        <header>
            <div class="logo-container">
                <img src="axiom-logo.png" alt="Axiom Shield Logo" class="logo-img">
            </div>
            <div class="company-name">AXIOM SHIELD</div>
            <div class="tagline">Preventing Sensitive Data Leaks into AI Tools</div>
        </header>

        <main>
            <div class="name">Vimal Makhija</div>
            <div class="title">Founder | AI Data Loss Prevention</div>

            <div class="contact-info">
                <a href="https://shield.aimagine.in" target="_blank">shield.aimagine.in</a>
                <a href="mailto:vimal@aimagine.in">vimal@aimagine.in</a>
                <a href="tel:+919871527925">+91 9871527925</a>
                <a href="https://linkedin.com/in/vimalmakhija" target="_blank">linkedin.com/in/vimalmakhija</a>
            </div>

            <div class="cta">
                <a href="https://calendly.com/axiomshield" target="_blank">Book Live Demo</a>
            </div>

            <div class="qr-section">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://shield.aimagine.in/business-card.html"
                    alt="Business Card QR Code" class="qr-code">
                <div class="qr-label">Scan to View Business Card</div>
            </div>
        </main>

        <div class="footer">
            Chrome Approved. Runs 100% Locally.
        </div>
    </div>

</body>

</html>
