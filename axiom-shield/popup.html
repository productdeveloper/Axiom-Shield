<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Axiom Shield</title>
    <style>
        body {
            width: 220px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fdfdfd;
            margin: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .logo {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }
        h1 {
            font-size: 16px;
            margin: 0;
            color: #111;
        }
        .status-card {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-icon {
            color: #16a34a;
            font-size: 20px;
        }
        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #166534;
        }
        .features-list {
            margin-top: 16px;
            font-size: 12px;
            color: #666;
            list-style: none;
            padding: 0;
        }
        .features-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #16a34a;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon-48.png" class="logo" alt="Logo">
        <h1>Axiom Shield</h1>
    </div>
    
    <div class="status-card">
        <span class="status-icon">🛡️</span>
        <span class="status-text">Shield is Active</span>
    </div>

    <ul class="features-list">
        <li><span class="dot"></span> PII Redaction enabled</li>
        <li><span class="dot"></span> Secret Scrubbing enabled</li>
        <li><span class="dot"></span> Liability Warning enabled</li>
    </ul>

    <script src="popup.js"></script>
</body>
</html>
